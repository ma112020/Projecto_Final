# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "weekly"
  allow:
  - dependency-type: "direct"
