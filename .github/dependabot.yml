# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  # 1. Monitoriza as tuas GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2. Monitoriza as bibliotecas Python (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"

  # 3. NOVO: Monitoriza o Docker Compose e os Dockerfiles
  - package-ecosystem: "docker"
    directory: "/" # Ele vai procurar o docker-compose.yml na raiz
    schedule:
      interval: "daily" # Alterado para diário para segurança crítica
    open-pull-requests-limit: 10 # Aumentado para não bloquear outros updates