server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: debug # <--- LINHA ADICIONADA AQUI

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 30s

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # Define a label 'job' com o nome do serviço docker-compose (ex: users-service)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: job
      
      # Adiciona o nome do contentor
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container_name
        
      # Caminho para o ficheiro de logs que o Promtail deve ler
      - source_labels: [__meta_docker_log_file]
        target_label: __path__