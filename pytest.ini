[pytest]
# Especificação explícita do diretório de testes
testpaths = ./tests

# Padrões de descoberta de ficheiros e funções
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registo de marcadores para eliminar os avisos de configuração
markers =
    unit: Testes unitários do microsserviço
    integration: Testes de integração entre serviços
    e2e: Testes de ponta a ponta (comunicação inter-serviços)

# Configuração de modo assíncrono para httpx/fastapi
asyncio_mode = strict

# Adiciona o diretório atual ao path para garantir que 'app' é visível
addopts = --doctest-modules